[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_std = 'gnu99'
cpp_std = 'gnu++17'
buildtype = 'release'
default_library = 'static'
c_args = ['-O3', '-msimd128', '-fPIC', '-DPANGO_ENABLE_BACKEND', '-DPANGO_ENABLE_ENGINE', '-DG_OS_UNIX', '-DNDEBUG', '-I/home/isaac/src/discere/discere-nucleus/client/emscripten/glib.wasm/install/include']
cpp_args = ['-O3', '-msimd128', '-fPIC', '-DPANGO_ENABLE_BACKEND', '-DPANGO_ENABLE_ENGINE', '-DG_OS_UNIX', '-DNDEBUG', '-I/home/isaac/src/discere/discere-nucleus/client/emscripten/glib.wasm/install/include']
c_link_args = ['-O3', '-msimd128', '-s', 'USE_PTHREADS=0']
cpp_link_args = ['-O3', '-msimd128', '-s', 'USE_PTHREADS=0']